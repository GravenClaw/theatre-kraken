<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration – Théâtre du Kraken</title>
<link rel="icon" type="image/png" href="favicon-admin.png">
<style>body{margin:0;padding:1.2rem;background:#140a0c;color:#f4e8d0;font:18px/1.5 Georgia,serif}main{max-width:720px;margin:0 auto}h1{color:#d4a24c;font-weight:400}
input,button{font:inherit;padding:.5rem .7rem;border-radius:6px;border:1px solid #6a4a4e;background:#0e0708;color:#f4e8d0}button{background:#8a1624;border-color:#d4a24c;cursor:pointer}
form{display:grid;gap:.6rem;max-width:360px}table{width:100%;border-collapse:collapse;margin-top:1rem}td,th{border-bottom:1px solid #4a2a2e;padding:.4rem;text-align:left}.err{color:#ff8a80}</style></head>
<body><main>
<h1>Administration des réservations</h1>
<form id="lf"><input id="em" type="email" placeholder="E-mail" autocomplete="username" required><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button type="submit">Se connecter</button></form>
<p id="err" class="err" role="alert"></p>
<div id="adm" hidden><p><span id="who"></span> <button id="out" type="button">Se déconnecter</button></p>
<p><b id="cnt">0</b> réservation(s). « Libérer » remet la place à disposition de tout le monde.</p>
<table><thead><tr><th>Place</th><th>Pseudo</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="firebase-config.js"></script>
<script type="module">
var C=window.FIREBASE_CONFIG,err=document.getElementById('err'),$=function(i){return document.getElementById(i)};
if(!C||!C.databaseURL){err.textContent='Firebase n’est pas configuré : voir firebase-config.js.'}
else{try{
const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
const {initializeApp}=await import(B+'firebase-app.js');
const {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}=await import(B+'firebase-auth.js');
const {getDatabase,ref,onValue,remove}=await import(B+'firebase-database.js');
const app=initializeApp(C),auth=getAuth(app),db=getDatabase(app);
$('lf').addEventListener('submit',async function(e){e.preventDefault();err.textContent='';
try{await signInWithEmailAndPassword(auth,$('em').value,$('pw').value)}catch(x){err.textContent='Connexion impossible : vérifiez l’e-mail et le mot de passe.'}});
$('out').addEventListener('click',function(){signOut(auth)});
var unsub=null;
function render(snap){var list=[];snap.forEach(function(c){var v=c.val()||{};list.push({k:c.key,seat:v.seat||c.key,name:v.name||''})});
list.sort(function(a,b){return a.seat<b.seat?-1:1});$('cnt').textContent=list.length;var tb=$('rows');tb.innerHTML='';
list.forEach(function(r){var tr=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td'),c=document.createElement('td'),bt=document.createElement('button');
a.textContent=r.seat;b.textContent=r.name;bt.type='button';bt.textContent='Libérer';
bt.addEventListener('click',function(){remove(ref(db,'reservations/'+r.k)).catch(function(){err.textContent='Suppression refusée : ce compte n’est pas autorisé dans les règles.'})});
c.appendChild(bt);tr.appendChild(a);tr.appendChild(b);tr.appendChild(c);tb.appendChild(tr)})}
onAuthStateChanged(auth,function(u){$('lf').hidden=!!u;$('adm').hidden=!u;
if(u){$('who').textContent=u.email;unsub=onValue(ref(db,'reservations'),render,function(){err.textContent='Lecture impossible.'})}
else if(unsub){unsub();unsub=null}})
}catch(e){err.textContent='Impossible de charger Firebase.'}}
</script></body></html>
