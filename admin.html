<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration – Théâtre du Kraken</title>
<link rel="icon" type="image/png" href="favicon-admin.png">
<style>
:root{--bg:#140a0c;--panel:#1d1013;--field:#0e0708;--line:#4a2a2e;--line2:#6a4a4e;--text:#f4e8d0;--muted:#b9a88a;--gold:#d4a24c;--red:#8a1624;--red2:#a81d30;--ok:#9ad49a;--bad:#ff8a80}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding:1.2rem;background:var(--bg);color:var(--text);font:18px/1.5 Georgia,serif}
main{max-width:760px;margin:0 auto}
h1{color:var(--gold);font-weight:400;font-size:1.6rem;margin:0}
input,button{font:inherit;padding:.55rem .8rem;border-radius:6px;border:1px solid var(--line2);background:var(--field);color:var(--text)}
button{background:var(--red);border-color:var(--gold);cursor:pointer}
button:hover{background:var(--red2)}
button.ghost{background:transparent;border-color:var(--line2);color:var(--muted)}
button.ghost:hover{border-color:var(--gold);color:var(--text)}
button.confirm{background:var(--gold);color:#140a0c;border-color:var(--gold);font-weight:700}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1rem;padding-bottom:1rem;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
.sub{margin:.15rem 0 0;color:var(--muted);font-size:.9rem}
.userbar{display:flex;align-items:center;gap:.7rem;font-size:.9rem;color:var(--muted)}
.userbar button{padding:.35rem .7rem;font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.2rem}
#lf{display:grid;gap:.9rem;max-width:380px;margin:1.5rem auto}
#lf h2{margin:0;font-size:1.1rem;font-weight:400;color:var(--gold)}
label{display:grid;gap:.25rem;font-size:.9rem;color:var(--muted)}
.msg{margin:0 0 1rem;padding:.6rem .8rem;border-radius:6px;font-size:.95rem}.msg:empty{display:none}
.msg.err{color:var(--bad);border:1px solid var(--bad)}.msg.ok{color:var(--ok);border:1px solid var(--ok)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.2rem;margin-bottom:1rem}
.count{display:flex;align-items:baseline;gap:.5rem}
.count b{font-size:2rem;color:var(--gold);font-weight:400;line-height:1}
.toolbar input{flex:1 1 200px;min-width:0}
.hint{margin:0 0 .8rem;color:var(--muted);font-size:.9rem}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:grid;grid-template-columns:7rem 1fr auto;align-items:center;gap:.8rem;padding:.55rem .2rem;border-bottom:1px solid var(--line)}
.seat{color:var(--gold);font-weight:700}
.name{overflow-wrap:anywhere}
.list li input{width:100%;padding:.35rem .6rem}
.actions{display:flex;gap:.4rem}
.actions button{padding:.35rem .8rem;font-size:.9rem;min-width:5.5rem}
.empty{display:block!important;padding:1.4rem .2rem;color:var(--muted);text-align:center}
@media (max-width:520px){body{padding:.8rem;font-size:17px}.list li{grid-template-columns:1fr;gap:.35rem}.name{color:var(--muted);font-size:.9rem}.actions{margin-top:.2rem}.actions button{flex:1}}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style></head>
<body><main>
<header>
<div><h1>Administration des réservations</h1><p class="sub">Théâtre du Kraken</p></div>
<div class="userbar" id="userbar" hidden><span id="who"></span><button id="out" type="button" class="ghost">Se déconnecter</button></div>
</header>
<p id="err" class="msg err" role="alert"></p>
<p id="ok" class="msg ok" role="status"></p>

<form id="lf" class="card">
<h2>Connexion</h2>
<label>E-mail<input id="em" type="email" autocomplete="username" required></label>
<label>Mot de passe<input id="pw" type="password" autocomplete="current-password" required></label>
<button type="submit">Se connecter</button>
</form>

<section id="adm" hidden>
<div class="toolbar">
<div class="count"><b id="cnt">0</b><span id="cntl">réservation</span></div>
<input id="q" type="search" placeholder="Rechercher une place ou un pseudo" aria-label="Rechercher une place ou un pseudo" autocomplete="off">
</div>
<p class="hint">« Modifier » change le pseudo associé à la place. « Libérer » remet la place à disposition de tout le monde (un second clic confirme).</p>
<ul class="list" id="rows"></ul>
</section>

</main>
<script src="firebase-config.js"></script>
<script type="module">
var C=window.FIREBASE_CONFIG,err=document.getElementById('err'),$=function(i){return document.getElementById(i)};
function fail(t){$('ok').textContent='';err.textContent=t}
function good(t){err.textContent='';$('ok').textContent=t}
if(!C||!C.databaseURL){fail('Firebase n’est pas configuré : voir firebase-config.js.')}
else{try{
const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
const {initializeApp}=await import(B+'firebase-app.js');
const {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}=await import(B+'firebase-auth.js');
const {getDatabase,ref,onValue,remove,update}=await import(B+'firebase-database.js');
const app=initializeApp(C),auth=getAuth(app),db=getDatabase(app);
var all=[],armed=null,armTimer=null,editing=null,needFocus=false,loaded=false,loadTimer=null;
function loading(){var tb=$('rows'),li=document.createElement('li');tb.innerHTML='';li.className='empty';li.textContent='Chargement des réservations…';tb.appendChild(li)}
$('lf').addEventListener('submit',async function(e){e.preventDefault();err.textContent='';$('ok').textContent='';
try{await signInWithEmailAndPassword(auth,$('em').value,$('pw').value)}catch(x){fail('Connexion impossible'+(x&&x.code?' ('+x.code+')':'')+' : vérifiez l’e-mail et le mot de passe.')}});
$('out').addEventListener('click',function(){signOut(auth)});
$('q').addEventListener('input',draw);
function disarm(){armed=null;clearTimeout(armTimer)}
function btn(label,cls,fn){var b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;b.addEventListener('click',fn);return b}
function save(r){
var v=editing.val.trim();
if(!v){fail('Le pseudo ne peut pas être vide.');return}
if(v===r.name){editing=null;draw();return}
editing=null;
update(ref(db,'reservations/'+r.k),{name:v}).then(function(){good('Pseudo de la place '+r.seat+' modifié.')}).catch(function(){draw();fail('Modification refusée : ce compte n’est pas autorisé dans les règles.')});
draw()}
function draw(){
var f=$('q').value.trim().toLowerCase(),tb=$('rows'),focusEl=null;tb.innerHTML='';
$('cnt').textContent=all.length;$('cntl').textContent=all.length>1?'réservations':'réservation';
var list=all.filter(function(r){return !f||r.seat.toLowerCase().indexOf(f)>-1||r.name.toLowerCase().indexOf(f)>-1});
if(!list.length){var li0=document.createElement('li');li0.className='empty';li0.textContent=all.length?'Aucun résultat pour cette recherche.':'Aucune réservation pour le moment.';tb.appendChild(li0);return}
list.forEach(function(r){
var li=document.createElement('li'),a=document.createElement('span'),act=document.createElement('div');
a.className='seat';a.textContent=r.seat;act.className='actions';li.appendChild(a);
if(editing&&editing.k===r.k){
var inp=document.createElement('input');inp.type='text';inp.maxLength=40;inp.value=editing.val;inp.setAttribute('aria-label','Nouveau pseudo pour la place '+r.seat);
inp.addEventListener('input',function(){editing.val=inp.value});
inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();save(r)}else if(e.key==='Escape'){editing=null;draw()}});
focusEl=inp;li.appendChild(inp);
act.appendChild(btn('Enregistrer','',function(){save(r)}));
act.appendChild(btn('Annuler','ghost',function(){editing=null;draw()}));
}else{
var b=document.createElement('span');b.className='name';b.textContent=r.name||'(sans pseudo)';li.appendChild(b);
act.appendChild(btn('Modifier','ghost',function(){disarm();editing={k:r.k,val:r.name};needFocus=true;draw()}));
var isArmed=armed===r.k;
act.appendChild(btn(isArmed?'Confirmer ?':'Libérer',isArmed?'confirm':'',function(e){
if(armed!==r.k){disarm();editing=null;armed=r.k;armTimer=setTimeout(function(){disarm();draw()},4000);draw();return}
disarm();e.currentTarget.disabled=true;
remove(ref(db,'reservations/'+r.k)).then(function(){good('Place '+r.seat+' libérée.')}).catch(function(){draw();fail('Suppression refusée : ce compte n’est pas autorisé dans les règles.')})}))}
li.appendChild(act);tb.appendChild(li)});
if(focusEl&&needFocus){focusEl.focus();focusEl.select();needFocus=false}}
function render(snap){loaded=true;clearTimeout(loadTimer);err.textContent='';all=[];snap.forEach(function(c){var v=c.val()||{};all.push({k:c.key,seat:String(v.seat||c.key),name:String(v.name||'')})});
all.sort(function(a,b){return a.seat.localeCompare(b.seat,'fr',{numeric:true})});draw()}
var unsub=null;
onAuthStateChanged(auth,function(u){$('lf').hidden=!!u;$('adm').hidden=!u;$('userbar').hidden=!u;
err.textContent='';$('ok').textContent='';
if(u){$('who').textContent=u.email;loaded=false;loading();
loadTimer=setTimeout(function(){if(!loaded){$('rows').innerHTML='';fail('La base ne répond pas après 8 secondes. Vérifiez databaseURL dans firebase-config.js et que la Realtime Database existe.')}},8000);
unsub=onValue(ref(db,'reservations'),render,function(e){clearTimeout(loadTimer);$('rows').innerHTML='';fail('Lecture impossible'+(e&&e.code?' ('+e.code+')':'')+' : vérifiez les règles de la base pour ce compte.')})}
else{if(unsub){unsub();unsub=null}clearTimeout(loadTimer);all=[];disarm();editing=null;$('q').value=''}})
}catch(e){fail('Impossible de charger Firebase.')}}
</script></body></html>
